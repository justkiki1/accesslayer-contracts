name: Contracts CI

# Fork-only verification baseline: upstream main currently fails `cargo fmt`
# and does not compile (creator-keys/src/lib.rs, commit d9e1eb4), so the
# workspace-wide checks are informational here and the new example crate is
# checked strictly.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust versions
        run: |
          rustc --version
          cargo fmt --version

      - name: Format check (workspace, informational)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Format check (consumer-contract)
        run: cargo fmt -p consumer-contract -- --check

      - name: Clippy (consumer-contract)
        run: cargo clippy -p consumer-contract --no-deps --all-targets -- -D warnings

      - name: Test (consumer-contract)
        run: cargo test -p consumer-contract

      - name: Clippy (workspace, informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace
